[package]
name = "launchpad"
version = "0.1.0"
description = "Bonding-curve token launchpad for Solana with automatic Raydium CPMM graduation"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "launchpad"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Use the devnet Raydium CPMM program id.
devnet = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed", "event-cpi"] }
anchor-spl = { version = "1.2.0", default-features = false, features = [
    "associated_token",
    "token",
    "token_2022",
    "token_2022_extensions",
] }

[dev-dependencies]
litesvm = "0.16.0"
solana-account = "4.3.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
proptest = "1.5"
serde_json = "1"
base64 = "0.22"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
